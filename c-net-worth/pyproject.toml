[project]
name = "couples-net-worth"
version = "0.1.0"
description = "Private home-network dashboard for a couple's net worth"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "cryptography>=50,<51",
  "fastapi[standard]>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "paho-mqtt>=2.1,<3",
  "playwright>=1.55,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D", "S"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
