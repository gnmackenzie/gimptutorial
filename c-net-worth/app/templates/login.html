{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}<h1>Sign in</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button>Sign in</button></form>{% endblock %}
