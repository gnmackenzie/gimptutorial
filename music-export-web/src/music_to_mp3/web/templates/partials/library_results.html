{% if albums %}<div class="results"><table><thead><tr><th>Select album</th><th>Artist</th><th>Album</th><th>Tracks</th></tr></thead><tbody>{% for item in albums %}<tr><td><input type="checkbox" name="interactive_selection" value="{{ item.artist }}/{{ item.album }}"></td><td>{{ item.artist }}</td><td>{{ item.album }}</td><td>{{ item.tracks }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p>No matching albums.</p>{% endif %}
